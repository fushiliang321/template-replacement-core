name: template-replacement-core-wasm

on:
  push:

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - name: Install wasm-strip
        run: |-
          sudo apt-get update
          sudo apt-get install -y wabt
      - name: Build WASM packages
        run: |-
          REPO_URL="git+https://github.com/fushiliang321/template-replacement-core.git"
          for crate in general sign polyfill/general polyfill/sign; do
            echo "Building $crate..."
            cd $crate
            if [[ "$crate" == polyfill/* ]]; then
              export RUSTFLAGS="-C target-feature=-multivalue"
            fi
            wasm-pack build --release --target web
            if [[ "$crate" == polyfill/* ]]; then
              unset RUSTFLAGS
            fi
            for wasm_file in pkg/*.wasm; do
              echo "Stripping $wasm_file..."
              wasm-strip "$wasm_file"
            done
            cd pkg
            node -e "const f=require('fs'),p='package.json';const j=JSON.parse(f.readFileSync(p,'utf8'));j.repository={type:'git',url:'$REPO_URL'};f.writeFileSync(p,JSON.stringify(j,null,2)+'\n','utf8')"
            cd ../..
          done
      - name: Publish general
        continue-on-error: true
        run: npm publish --access public general/pkg
      - name: Publish sign
        continue-on-error: true
        run: npm publish --access public sign/pkg
      - name: Publish polyfill/general
        continue-on-error: true
        run: npm publish --access public polyfill/general/pkg
      - name: Publish polyfill/sign
        continue-on-error: true
        run: npm publish --access public polyfill/sign/pkg