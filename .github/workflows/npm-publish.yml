name: template-replacement-core-wasm

on:
  push:

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - name: Install wasm-strip
        run: |-
          sudo apt-get update
          sudo apt-get install -y wabt
      - name: Build WASM packages
        run: |-
          REPO_URL="git+https://github.com/fushiliang321/template-replacement-core.git"
          for crate in general sign general-polyfill sign-polyfill; do
            echo "Building $crate..."
            cd $crate
            wasm-pack build --release --target web
            wasm-strip pkg/*.wasm
            cd pkg
            node -e "const f=require('fs'),p='package.json';const j=JSON.parse(f.readFileSync(p,'utf8'));j.repository={type:'git',url:'$REPO_URL'};f.writeFileSync(p,JSON.stringify(j,null,2)+'\n','utf8')"
            cd ../..
          done
      - name: Publish general
        continue-on-error: true
        run: cd general/pkg && npm publish
      - name: Publish general-polyfill
        continue-on-error: true
        run: cd general-polyfill/pkg && npm publish
      - name: Publish sign
        continue-on-error: true
        run: cd sign/pkg && npm publish
      - name: Publish sign-polyfill
        continue-on-error: true
        run: cd sign-polyfill/pkg && npm publish