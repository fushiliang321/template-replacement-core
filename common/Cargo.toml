[package]
name = "common"
version = "0.1.0"
edition = "2021"

[dependencies]
crossbeam-channel = "0.5.14"
regex = "1.11.1"
wasm-bindgen = { version = "0.2.99" }
flate2 = "1.0.35"
zip = { version = "2.2.2", default-features = false, features = ["_deflate-any", "deflate"] }
console_log = "1.0.0"
log = "0.4.22"
console_error_panic_hook = "0.1.7"
serde = { version = "1.0.216", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3.76"
lazy_static = "1.5.0"
async_zip = { version = "0.0.17", features = ["full-wasm"] }
async-std = { version = "1.13.0", features = ["attributes"] }
futures = "0.3.31"
md-5 = "0.10.6"
wasm-bindgen-futures = "0.4.49"
once_cell = "1.20.2"
serde_json = "1.0.134"
rmp-serde = "1.3.0"
base64 = "0.22.1"

[dev-dependencies]
console_error_panic_hook = "0.1.7"

[lib]
name = "common"
path = "src/lib.rs"
crate-type = ["rlib", "dylib"]

[features]
_deflate-any = ["deflate-flate2"]
deflate-flate2 = ["flate2/any_impl", "flate2/rust_backend", "_deflate-any"]

[profile.release]
opt-level = 3  # 最大化性能
lto = true       # 启用链接时优化
codegen-units = 1
panic = 'abort'  # 出现 panic 时直接终止程序
