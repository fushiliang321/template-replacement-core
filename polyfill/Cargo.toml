[workspace]
members = ["sign", "general"]
resolver = "2"

[workspace.package]
version = "1.8.8"
edition = "2024"
license = "Apache 2.0"

[profile.release]
opt-level = 3  # 最大化性能
lto = true       # 启用链接时优化
codegen-units = 1
panic = 'abort'  # 出现 panic 时直接终止程序
debug = false

[workspace.dependencies]
wasm-bindgen = "=0.2.93"
js-sys = "=0.3.70"
